<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>امتحان الفصل 5 — جمع البيانات وتنقيتها</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#16232e;--mu:#5b6b76;--bg:#eef3f1;--cd:#fff;--ln:#c9d5d0;--ac:#0e7c66;--acs:#d9efe9;--bad:#b4401f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.8 Tajawal,Tahoma,"Segoe UI",sans-serif}
main{max-width:680px;margin:0 auto;padding:18px 16px 60px}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:22px}
h1{font-size:25px;line-height:1.5;margin:0 0 8px}
p{margin:0 0 12px}.mu{color:var(--mu);font-size:15px}
input,textarea{width:100%;font:inherit;padding:11px 13px;border:1.5px solid var(--ln);border-radius:10px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:170px}
input:focus,textarea:focus,button:focus-visible{outline:3px solid var(--acs);border-color:var(--ac)}
.btn{font:inherit;font-weight:700;background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 26px;cursor:pointer}
.btn:disabled{background:#a9b8b2;cursor:not-allowed}
.btn.sec{background:#fff;color:var(--ac);border:1.5px solid var(--ac)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:15px;color:var(--mu)}
.bar b{color:var(--ink);font-variant-numeric:tabular-nums}
.seg{display:flex;gap:3px;margin-bottom:16px}
.seg i{flex:1;height:6px;border-radius:3px;background:var(--ln)}
.seg i.d{background:var(--ac)}.seg i.c{background:var(--ink)}
.tag{display:inline-block;font-size:14px;background:var(--acs);color:var(--ac);border-radius:6px;padding:0 10px;margin-bottom:8px}
.q{font-size:20px;font-weight:700;line-height:1.7;margin:0 0 16px}
.ops{display:grid;gap:10px;margin-bottom:18px}
.op{font:inherit;text-align:right;display:flex;gap:12px;align-items:center;background:#fff;border:1.5px solid var(--ln);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.op b{flex:none;width:32px;height:32px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:15px}
.op.s{border-color:var(--ac);background:var(--acs)}.op.s b{background:var(--ac);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px}
.big{font-size:52px;font-weight:700;color:var(--ac);line-height:1.2}
.err{color:var(--bad);font-size:15px;min-height:24px}
#st.f{color:var(--bad)}
.rv{border-inline-start:4px solid var(--ln);padding:6px 12px;margin-bottom:10px;font-size:16px}.rv.y{border-color:var(--ac)}.rv.n{border-color:var(--bad)}
ul.r{padding-inline-start:20px;margin:0 0 14px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const BOT="7976858796:AAFprF9yRKhdHxokxrHJK6rhLZM8bsOCxpE",CHAT="1840535062";
const T="الدرس ";
const Q=[
{k:"m",l:"5-1",q:"ما اسم البيانات التي تُجمع مباشرة لغرض الدراسة الحالية؟",o:["البيانات الأولية","البيانات الثانوية","البيانات المفتوحة","البيانات المكررة"],a:0},
{k:"m",l:"5-1",q:"أي مما يلي يُعد مثالًا على بيانات ثانوية؟",o:["استبيان صممته بنفسك وجمعت ردوده","إحصاءات سكانية نشرتها الحكومة","مقابلات أجريتها بنفسك","حركة مرور لاحظتها وسجلتها بنفسك"],a:1},
{k:"m",l:"5-1",q:"ما المعاينة الطبقية؟",o:["اختيار الأفراد الأسهل وصولًا","اختيار عشوائي من المجتمع كله دون تقسيم","تقسيم المجتمع إلى طبقات ثم اختيار عينة عشوائية من كل طبقة","دراسة جميع أفراد المجتمع"],a:2},
{k:"m",l:"5-1",q:"باحث قابل المارة أمام المحطة بعد ظهر أيام الأسبوع فقط وقدّم النتائج على أنها «آراء جميع المواطنين». ما نوع التحيز؟",o:["تحيز الوقت/الموقع","معاينة عشوائية بسيطة","تعداد شامل","بيانات ثانوية"],a:0},
{k:"t",l:"5-1",q:"البيانات الأولية هي بيانات سبق جمعها ونشرها من قِبل آخرين.",a:1},
{k:"t",l:"5-1",q:"قد تعطي العينة المتحيزة استنتاجًا واثقًا لكنه خاطئ حتى لو كانت الحسابات صحيحة.",a:0},
{k:"t",l:"5-1",q:"تحيز المعاينة وتحيز الاستجابة مشكلتان متطابقتان.",a:1},
{k:"m",l:"5-2",q:"عندما تكون القيم المفقودة قليلة ولا تسبب تحيزًا مهمًا، فأي استجابة قد تناسب؟",o:["حذف السجلات التي تحتوي عليها","تجاهل التنظيف كليًا","حذف العمود بأكمله","تعويضها دائمًا بأكبر قيمة"],a:0},
{k:"m",l:"5-2",q:"متى يناسب وضع علامة (مؤشر) على القيمة المفقودة؟",o:["عندما تكون القيمة خطأ إدخال","عندما يكون للغياب نفسه معنى، كرفض الإجابة","في جميع الحالات","لا يناسب أبدًا"],a:1},
{k:"m",l:"5-2",q:"أي عبارة تصف التعامل مع القيم الشاذة بأكبر قدر من الدقة؟",o:["كلها أخطاء ويجب حذفها فور اكتشافها","لا تؤثر في التحليل","تُستبدل بالمتوسط دائمًا","نحدد السبب أولًا: نصحح أو نحذف إذا كانت خطأ إدخال، ونحتفظ بها إذا عكست الواقع"],a:3},
{k:"m",l:"5-2",q:"ما المعالجة التي تحوّل البيانات إلى نطاق من 0 إلى 1؟",o:["التوحيد القياسي","تحجيم Min–Max","الربط","التجميع"],a:1},
{k:"m",l:"5-2",q:"ربط سجل الطالب بورقة الدرجات عبر «رقم الطالب» في جدول واحد يسمى:",o:["المحور (Pivot)","التجميع","الربط","التعويض"],a:2},
{k:"t",l:"5-2",q:"تنظيف البيانات عمل يُجرى قبل جمع البيانات.",a:1},
{k:"t",l:"5-2",q:"التوحيد القياسي يحوّل البيانات إلى صيغة متوسطها 0 وانحرافها المعياري 1.",a:0},
{k:"t",l:"5-2",q:"يجب حذف أي سجلين متشابهين ظاهريًا فورًا لأنهما تكرار.",a:1},
{k:"m",l:"5-3",q:"ما المنصة التي تُجري مسابقات تحليل البيانات وتتيح مجموعات بيانات في مجالات متنوعة؟",o:["World Bank Open Data","UN Data","Kaggle","JSON"],a:2},
{k:"m",l:"5-3",q:"أي خيار يصف تسلسل الحصول على البيانات عبر واجهة برمجة التطبيقات (API) بأكبر قدر من الدقة؟",o:["الخادم يرسل البيانات باستمرار دون أي طلب","يرسل العميل طلبًا إلى نقطة نهاية (Endpoint)، ويعيد الخادم استجابة غالبًا بصيغة JSON","العملاء يتبادلون البيانات مباشرة فيما بينهم","الخادم يخزن البيانات فقط ولا يمكن استرجاعها"],a:1},
{k:"m",l:"5-3",q:"ما JSON؟",o:["لغة برمجة للمواقع","ترخيص لاستخدام البيانات","مزود بيانات مفتوحة","صيغة نصية شائعة لتمثيل البيانات المهيكلة"],a:3},
{k:"t",l:"5-3",q:"طالما أن البيانات مفتوحة فيمكن استخدامها بحرية دون التحقق من شروط الاستخدام.",a:1},
{k:"t",l:"5-3",q:"الوصول إلى البيانات عبر API يلغي شروط الاستخدام والترخيص الخاصة بها.",a:1},
{k:"e",l:"5-1",q:"اشرح لماذا يمكن لعينة متحيزة أن تجعل التحليل عديم القيمة حتى عندما تكون الحسابات صحيحة. (6 درجات)",
m:"• العينة المتحيزة تُختار بطريقة تجعل بعض أفراد المجتمع أكثر أو أقل احتمالًا للتمثيل، فلا تعكس المجتمع الإحصائي. (درجتان)\n• لذلك لا يمكن تعميم نتائجها على المجتمع كله، لأن الحساب الدقيق لا يصلح عيبًا وقع في الجمع. (درجتان)\n• مثال: استطلاع أمام المحطة بعد ظهر أيام الأسبوع يستبعد الموظفين والطلاب فيعطي استنتاجًا يبدو واثقًا لكنه خاطئ؛ ويُعالج بالمعاينة العشوائية أو الطبقية. (درجتان)"},
{k:"e",l:"5-2",q:"اشرح، باستخدام «مدخلات خاطئة — مخرجات خاطئة»، لماذا يهم تحضير البيانات بقدر أهمية التحليل نفسه، مستعينًا بإصلاح واحد للتنظيف وتحويل واحد. (6 درجات)",
m:"• «مدخلات خاطئة — مخرجات خاطئة»: الحساب الدقيق على بيانات معيبة يعطي نتيجة معيبة، فجودة التحضير تحدد جودة التحليل. (درجتان)\n• مثال تنظيف: معالجة القيم المفقودة (حذف أو تعويض أو وضع علامة)، أو تصحيح خطأ إدخال، أو حذف تكرار حقيقي فقط. (درجتان)\n• مثال تحويل: توحيد صيغ التواريخ، أو تحجيم Min–Max / التوحيد القياسي حتى لا يهيمن متغير بحكم مقياسه، أو الربط والتجميع لإعادة التشكيل. (درجتان)"},
{k:"e",l:"5-3",q:"اشرح لماذا يجب على المحلل التحقق من شروط الاستخدام والإشارة إلى المصدر حتى عندما تكون البيانات مجانية ومفتوحة. (6 درجات)",
m:"• للبيانات المفتوحة ترخيص أو شروط تحدد ما يُسمح به من وصول وإعادة استخدام وإعادة توزيع؛ فالمجانية لا تعني عدم وجود قواعد، والوصول عبر API لا يلغيها. (درجتان)\n• يجب نسب البيانات للمصدر: المزود، اسم البيانات، تاريخ الحصول، والرابط (URL). (درجتان)\n• ذكر المصدر لا يثبت الموثوقية وحدها، لكنه يتيح للآخرين العثور على البيانات وتقييمها ومراجعة التحليل. (درجتان)"}
];
const SHOW_REVIEW=true; /* false = لا يرى الطالب التصحيح بعد الإنهاء */
const N=Q.length,NO=Q.filter(q=>q.k!="e").length,L=["أ","ب","جـ","د"];
const $=s=>document.querySelector(s);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=ms=>{const s=Math.round(ms/1000);return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const clk=d=>new Date(d).toLocaleTimeString("ar-EG",{hour12:false});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const lab=(q,j)=>q.k=="t"?["صح","خطأ"][j]:L[j];
let S=null,tm=null,mid=null,dirty=false,busy=false,bad=false,fails=[],chain=Promise.resolve(),pend=0;
const API="https://api.telegram.org/bot"+BOT+"/";

/* ---------- Telegram: رسالة واحدة تُعدَّل مع كل حركة ---------- */
async function call(m,body){
  for(let n=0;n<4;n++){
    try{
      const r=await fetch(API+m,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Object.assign({chat_id:CHAT},body))});
      const j=await r.json();
      if(j.ok)return j;
      if(/not modified/i.test(j.description||""))return{ok:true};
      if(j.error_code==429){await wait(((j.parameters&&j.parameters.retry_after)||2)*1000);continue;}
    }catch(e){}
    await wait(1500*(n+1));
  }
  return null;
}
async function flush(){
  if(busy)return;busy=true;
  while(dirty){
    dirty=false;upd();
    const t=render().slice(0,4000);let j;
    if(mid===null){j=await call("sendMessage",{text:t});if(j&&j.result)mid=j.result.message_id;}
    else j=await call("editMessageText",{message_id:mid,text:t});
    bad=!j;
  }
  busy=false;upd();
}
function push(){dirty=true;flush();}
function send(text){ /* رسائل منفصلة (تفاصيل المقالي فقط) */
  pend++;upd();
  chain=chain.then(()=>call("sendMessage",{text:text.slice(0,4000)})).then(j=>{pend--;if(!j)fails.push(text);upd();});
}
function upd(){
  document.querySelectorAll(".sts").forEach(e=>{
    const f=bad||fails.length;
    e.className="sts"+(f?" f":"");
    e.textContent=f?"⚠ تعذر الإرسال — سيُعاد مع الحركة التالية":(busy||pend)?"… جارٍ التحديث":"✓ تم تحديث تقرير المعلم";
  });
}
function line(j,r){
  const q=Q[j],ex=(r.aw?" ⚠️"+fmt(r.aw):"");
  if(q.k=="e"){
    const x=r.x.replace(/\s+/g," ");
    return "س"+(j+1)+" ✍️ ⏱"+fmt(r.t)+(r.ps?" 📋لصق"+r.ps:"")+ex+"\n    «"+x.slice(0,110)+(x.length>110?"…":"")+"»\n";
  }
  return "س"+(j+1)+" "+(r.ok?"✅ ":"❌ ")+lab(q,r.s)+(r.ok?"":" (الصحيحة: "+lab(q,q.a)+")")+" ⏱"+fmt(r.t)+(r.cc?" 🔄"+r.cc:"")+ex+"\n";
}
function score(){return S.rec.filter(r=>r&&r.ok===true).length;}
function render(){
  let h="📋 تقرير الامتحان — الفصل 5\n👤 "+S.name+"\n🕒 البدء: "+clk(S.t0)+" | آخر تحديث: "+clk(Date.now())+"\n";
  if(S.done)h+="🏁 انتهى | الدرجة الموضوعية: "+score()+"/"+NO+" ("+Math.round(score()/NO*100)+"%) | الوقت: "+fmt(S.end-S.t0)+"\n✍️ تفاصيل المقالي والإجابات النموذجية في الرسائل التالية\n";
  else if(S.closed)h+="🔴 أغلق الصفحة قبل الإنهاء (عند س"+(S.i+1)+")\n";
  else h+="📍 الآن: س"+(S.i+1)+"/"+N+" | الوقت الكلي: "+fmt(Date.now()-S.t0)+"\n";
  h+="⚠️ مغادرة الصفحة: "+S.lv+(S.lv?" ("+fmt(S.aw)+")":"")+"\n──────────\n";
  for(let j=0;j<N;j++){
    const r=S.rec[j];
    if(r)h+=line(j,r);
    else if(j==S.i&&S.run){
      const q=Q[j];
      h+="س"+(j+1)+" 🔵 جارٍ الحل"+(q.k!="e"&&S.sel!==null?" (اختار: "+lab(q,S.sel)+")":"")+"\n";
    }
  }
  if(S.log.length)h+="──────────\n"+S.log.slice(-5).join("\n");
  return h;
}

/* ---------- Screens ---------- */
function intro(){
  $("#app").innerHTML=`<div class="card">
  <h1>امتحان الفصل 5: جمع البيانات وتنقيتها</h1>
  <p class="mu">البرمجة والذكاء الاصطناعي — الصف الثاني الثانوي</p>
  <ul class="r"><li>${NO} سؤالًا موضوعيًا (اختيار من متعدد وصح/خطأ) و${N-NO} أسئلة مقالية.</li>
  <li>تُسجَّل حركتك وإجاباتك أولًا بأول في تقرير يراه المعلم، ولا يمكن الرجوع للسؤال السابق.</li>
  <li>يُسجَّل الوقت المستغرق في كل سؤال، ومرات مغادرة الصفحة. لا يوجد إنهاء تلقائي.</li></ul>
  <p><label for="nm">اسمك الكامل</label></p>
  <input id="nm" autocomplete="name" placeholder="مثال: أحمد محمد علي">
  <div class="err" id="er"></div>
  <button class="btn" id="go">ابدأ الامتحان</button></div>`;
  $("#go").onclick=start;
}
function start(){
  const n=$("#nm").value.trim();
  if(n.length<3){$("#er").textContent="اكتب اسمك الكامل (3 أحرف على الأقل).";return;}
  S={name:n,i:0,rec:[],log:[],t0:Date.now(),run:true,aw:0,lv:0,sel:null};
  tm=setInterval(tick,1000);show();
}
function show(){
  const q=Q[S.i],e=q.k=="e";
  S.qs=Date.now();S.qa=0;S.cc=0;S.sel=null;S.ps=0;
  const o=q.k=="t"?["صح","خطأ"]:q.o;
  const body=e?`<textarea id="tx" placeholder="اكتب إجابتك هنا…"></textarea>`
    :`<div class="ops">`+o.map((t,j)=>`<button class="op" data-j="${j}"><b>${q.k=="t"?(j?"✗":"✓"):L[j]}</b><span>${t}</span></button>`).join("")+`</div>`;
  $("#app").innerHTML=`<div class="bar"><span>سؤال <b>${S.i+1}</b> من ${N}</span><span>الكلي <b id="tt">0:00</b> · السؤال <b id="qt">0:00</b></span><span class="sts"></span></div>
  <div class="seg">${Q.map((_,j)=>`<i class="${j<S.i?"d":j==S.i?"c":""}"></i>`).join("")}</div>
  <div class="card"><span class="tag">${T}${q.l}${e?" · مقالي":q.k=="t"?" · صح أم خطأ":""}</span>
  <p class="q">${q.q}</p>${body}
  <div class="row"><span class="mu">${e?"اكتب إجابة كاملة قبل المتابعة.":"اختر إجابة واحدة."}</span>
  <button class="btn" id="nx" disabled>${S.i==N-1?"إنهاء وإرسال":"التالي"}</button></div></div>`;
  if(e){
    const t=$("#tx");
    t.oninput=()=>{$("#nx").disabled=!t.value.trim();};
    t.onpaste=()=>{S.ps++;};
    t.focus();
  }else document.querySelectorAll(".op").forEach(b=>b.onclick=()=>{
    const j=+b.dataset.j;
    if(S.sel===j)return;
    if(S.sel!==null)S.cc++;
    S.sel=j;
    document.querySelectorAll(".op").forEach(x=>x.classList.toggle("s",+x.dataset.j===j));
    $("#nx").disabled=false;
    push();
  });
  $("#nx").onclick=next;
  upd();tick();push();
}
function next(){
  const q=Q[S.i],t=Date.now()-S.qs,r={t,cc:S.cc,aw:S.qa,ps:S.ps};
  if(q.k=="e")r.x=$("#tx").value.trim();
  else{r.s=S.sel;r.ok=S.sel===q.a;}
  S.rec[S.i]=r;
  if(++S.i<N)show();else finish();
}
function finish(){
  S.run=false;S.done=true;S.end=Date.now();clearInterval(tm);
  Q.forEach((q,j)=>{
    if(q.k!="e")return;
    send("✍️ س"+(j+1)+" — "+S.name+"\n❓ "+q.q+"\n\n💬 إجابة الطالب:\n"+S.rec[j].x.slice(0,1800)+"\n\n✅ الإجابة النموذجية:\n"+q.m+"\n\n📌 قيّم إجابة الطالب من 6 درجات.");
  });
  push();
  const sc=score();
  $("#app").innerHTML=`<div class="card"><h1>تم إنهاء الامتحان</h1>
  <p class="mu">${esc(S.name)}</p>
  <div class="big">${sc}/${NO}</div><p>درجة الأسئلة الموضوعية. الأسئلة المقالية سيصححها المعلم.</p>
  <p>الوقت الكلي: <b>${fmt(S.end-S.t0)}</b></p>${review()}
  <p><span class="sts"></span></p>
  <button class="btn sec" id="rt">إعادة إرسال ما تعذر</button></div>`;
  $("#rt").onclick=()=>{fails.splice(0).forEach(send);push();};
  upd();
}
function review(){
  if(!SHOW_REVIEW)return"";
  return"<h2 style='font-size:19px;margin:18px 0 8px'>تصحيح الأسئلة الموضوعية</h2>"+Q.map((q,j)=>{
    if(q.k=="e")return"";
    const o=q.k=="t"?["صح","خطأ"]:q.o,r=S.rec[j];
    return`<div class="rv ${r.ok?"y":"n"}"><b>س${j+1} ${r.ok?"✅ صحيحة":"❌ خاطئة"}</b><br>${q.q}<br><span class="mu">إجابتك: ${o[r.s]}${r.ok?"":" — الصحيحة: "+o[q.a]}</span></div>`;
  }).join("");
}
function tick(){
  if(!S||!S.run)return;
  const a=$("#tt"),b=$("#qt");
  if(a)a.textContent=fmt(Date.now()-S.t0);
  if(b)b.textContent=fmt(Date.now()-S.qs);
}

/* ---------- Activity tracking ---------- */
let hs=0;
document.addEventListener("visibilitychange",()=>{
  if(!S||!S.run)return;
  if(document.hidden)hs=Date.now();
  else if(hs){
    const d=Date.now()-hs;hs=0;
    if(d<1500)return;
    S.qa+=d;S.aw+=d;S.lv++;
    S.log.push("⚠️ غاب "+fmt(d)+" أثناء س"+(S.i+1)+" ("+clk(Date.now())+")");
    push();
  }
});
addEventListener("beforeunload",e=>{if(S&&S.run){e.preventDefault();e.returnValue="";}});
addEventListener("pagehide",()=>{
  if(!S||!S.run)return;
  S.closed=true;S.run=false;
  const b={chat_id:CHAT,text:render().slice(0,4000)};
  if(mid!==null)b.message_id=mid;
  navigator.sendBeacon(API+(mid!==null?"editMessageText":"sendMessage"),new Blob([JSON.stringify(b)],{type:"application/json"}));
});
intro();
</script>
